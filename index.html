<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <!-- theme -->
        <div class="theme">
            <button id="themeButton" onclick="toggleTheme()">
                <img src="icons/light.svg" alt="Theme">
            </button>
        </div>

        <!-- Input display -->
         <div class="display-container">
            <input type="text" id="display" readonly>
        </div>
        

        <!-- History and Delete -->
        <div class="controls">
            <button onclick="showHistory()">
                <img src="icons/history.svg" alt="History">
            </button>
            <button onclick="deleteLast()">
                <img src="icons/backspace.svg" alt="Delete">
            </button>
        </div>

        <!-- Calculator buttons -->
        <div class="buttons">
            <button class="action" onclick="clearDisplay()">C</button>
            <button class="action" onclick="displayValue('()')">()</button>
            <button class="action" onclick="displayValue('*')">x</button>
            <button class="action" onclick="displayValue('/')">/</button>

            <button onclick="displayValue('7')">7</button>
            <button onclick="displayValue('8')">8</button>
            <button onclick="displayValue('9')">9</button>
            <button class="action" onclick="displayValue('-')">-</button>

            <button onclick="displayValue('4')">4</button>
            <button onclick="displayValue('5')">5</button>
            <button onclick="displayValue('6')">6</button>
            <button class="action" onclick="displayValue('+')">+</button>

            <button onclick="displayValue('1')">1</button>
            <button onclick="displayValue('2')">2</button>
            <button onclick="displayValue('3')">3</button>
            <button class="action" onclick="displayValue('%')">%</button>

            <button class="action" onclick="toggleSign()">+/-</button>
            <button onclick="displayValue('0')">0</button>
            <button class="action" onclick="displayValue('.')">.</button>
            <button class="action" onclick="calculate()">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
